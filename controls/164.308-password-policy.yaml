apiVersion: concord.dev/v1
kind: Control

metadata:
  id: HIPAA-164.308-password-policy
  name: password-management
  title: AWS IAM password policy meets HIPAA-equivalent strength requirements
  framework: hipaa
  category: Administrative Safeguards
  severity: high
  tags:
    - hipaa
    - identity
    - password
  owners:
    - team: it-security

spec:
  description: |
    HIPAA Security Rule §164.308(a)(5)(ii)(D) (Password Management)
    requires procedures for creating, changing, and safeguarding
    passwords. NIST SP 800-63B is the operational floor most HHS/OCR
    auditors apply. Concord verifies the AWS IAM account password
    policy meets length, complexity, and reuse criteria.

  rationale: |
    Default IAM password policies are too weak for HIPAA-protected
    workloads. A 12-character minimum with mixed character classes,
    90-day rotation, and reuse-prevention is the floor HHS audits
    converge on for cloud accounts holding ePHI.

  evidence:
    - id: iam_password_policy
      source: aws
      type: iam_password_policy
      fixture: ../tests/fixtures/password-policy-pass.json
      params:
        region: ${env.AWS_REGION}

  policy:
    engine: rego
    package: concord.hipaa.password_policy
    file: ../policies/password_policy.rego

  remediation:
    runbook: docs/remediation/hipaa-164.308-password-policy.md
    auto_fix: true
    estimated_effort: 15m

  mappings:
    hipaa:
      - "164.308(a)(5)(ii)(D)"
    soc2:
      - "CC6.1"
    nist_800_53:
      - "IA-5"
    iso27001:
      - "A.5.17"
    cis_aws:
      - "1.8"
      - "1.9"

  status: stable
  blocking: true
