apiVersion: concord.dev/v1
kind: Control

metadata:
  id: HIPAA-164.312-audit-controls
  name: audit-controls
  title: Audit log retention meets HIPAA six-year minimum and logs are KMS-encrypted
  framework: hipaa
  category: Technical Safeguards
  severity: high
  tags:
    - hipaa
    - audit
    - logging
  owners:
    - team: security

spec:
  description: |
    HIPAA Security Rule §164.312(b) (Audit Controls) requires hardware,
    software, and procedural mechanisms that record and examine
    activity in information systems that contain or use ePHI.
    §164.530(j)(2) requires policies and procedures (and the
    associated audit logs) to be retained for six years. Concord
    verifies CloudWatch Logs group retention is ≥ 2,190 days and
    that logs are encrypted with a customer-managed KMS key.

  rationale: |
    The six-year retention floor is HIPAA-specific and longer than
    SOC 2 or ISO 27001. Default CloudWatch retention is "never
    expire" which appears safe but typically gets misconfigured to
    7 or 30 days for cost reasons. Concord catches that drift.

  evidence:
    - id: cloudwatch_logs
      source: aws
      type: cloudwatch_log_groups
      fixture: ../tests/fixtures/audit-controls-pass.json
      params:
        region: ${env.AWS_REGION}

  policy:
    engine: rego
    package: concord.hipaa.audit_controls
    file: ../policies/audit_controls.rego

  remediation:
    runbook: docs/remediation/hipaa-164.312-audit-controls.md
    auto_fix: true
    estimated_effort: 1h

  mappings:
    hipaa:
      - "164.312(b)"
      - "164.530(j)(2)"
    soc2:
      - "CC7.2"
    nist_800_53:
      - "AU-11"
      - "AU-9"
    iso27001:
      - "A.8.15"

  status: stable
  blocking: true
